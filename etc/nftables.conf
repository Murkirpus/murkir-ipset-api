# Шаг 1. Проверь, где у тебя лежит файл и читает ли его systemd-сервис:
# ls -la /etc/nftables.conf
# systemctl cat nftables | grep ExecStart

# Шаг 2. Применить прямо сейчас (разово, без ребута):
# sudo nft -f /etc/nftables.conf
# sudo nft -a list ruleset

# Шаг 3. Включить автозагрузку при старте системы:
# sudo systemctl enable --now nftables
# sudo systemctl status nftables --no-pager

flush ruleset

table inet filter {
        set banned {
                type ipv4_addr
                flags timeout
        }

        set banned6 {
                type ipv6_addr
                flags timeout
        }

        set banned_net {
                type ipv4_addr
                flags interval,timeout
        }

        set banned_net6 {
                type ipv6_addr
                flags interval,timeout
        }

        chain input {
                type filter hook input priority 0; policy accept;

                # 1. Оптимизация и локальный трафик
                iifname "lo" accept
                ct state established,related accept
                ct state invalid drop

                # 2. Проверка по блэк-листам
                ip6 saddr @banned_net6 drop
                ip saddr @banned_net drop
                ip6 saddr @banned6 drop
                ip saddr @banned drop
        }
}

